<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" shape-rendering="crispEdges" role="img" aria-label="Clawd waving">
  <style>
    .bob { animation: bob 1.6s ease-in-out infinite; }
    .arm { animation: wave 0.8s ease-in-out infinite; transform-origin: 36px 66px; transform-box: view-box; }
    .eyes { animation: blink 4s infinite; transform-origin: 100px 52px; transform-box: view-box; }
    .shadow { animation: shadow 1.6s ease-in-out infinite; transform-origin: 100px 138px; transform-box: view-box; }
    .spark { animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes wave { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-28deg) } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity:.35 } 50% { transform: scaleX(.8); opacity:.2 } }
    @keyframes twinkle { 0%,100% { opacity: 0 } 50% { opacity: 1 } }
  </style>
  <ellipse class="shadow" cx="100" cy="138" rx="46" ry="5" fill="#8b8b8b"/>
  <g class="spark" fill="#D97757"><rect x="20" y="20" width="4" height="12"/><rect x="16" y="24" width="12" height="4"/></g>
  <g class="spark s2" fill="#E8A87C"><rect x="170" y="34" width="4" height="10"/><rect x="167" y="37" width="10" height="4"/></g>
  <g class="spark s3" fill="#D97757"><rect x="160" y="96" width="3" height="9"/><rect x="157" y="99" width="9" height="3"/></g>
  <g class="bob">
    <g fill="#D97757">
      <rect x="52" y="30" width="96" height="66"/>
      <rect x="148" y="58" width="16" height="16"/>
      <g class="arm"><rect x="22" y="58" width="30" height="16"/><rect x="22" y="44" width="14" height="16"/></g>
    </g>
    <g class="eyes" fill="#141413">
      <rect x="76" y="44" width="10" height="18"/>
      <rect x="114" y="44" width="10" height="18"/>
    </g>
    <g fill="#D97757">
      <rect x="62" y="96" width="10" height="26"/><rect x="84" y="96" width="10" height="26"/>
      <rect x="106" y="96" width="10" height="26"/><rect x="128" y="96" width="10" height="26"/>
    </g>
  </g>
</svg>
